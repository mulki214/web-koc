services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: knockout
      POSTGRES_USER: knockout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knockout}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  pgdata:
